# Un solo servicio en el plan gratuito. Render asigna una URL *.onrender.com.
# No declares aquí un dominio propio.
services:
  - type: web
    name: hivex
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hivex-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "1"
      - key: SEED_ON_BOOT
        value: "1"
      - key: ACCESS_USER
        value: hivex
      - key: ACCESS_PASSWORD
        generateValue: true
databases:
  - name: hivex-db
    plan: free
    databaseName: hivex
    user: hivex
