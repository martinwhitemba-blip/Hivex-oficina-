services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hivex
      POSTGRES_PASSWORD: hivex
      POSTGRES_DB: hivex
    ports:
      - "5432:5432"
    volumes:
      - hivex-pg:/var/lib/postgresql/data
  app:
    build: .
    ports:
      - "8787:8787"
    environment:
      DATABASE_URL: postgresql://hivex:hivex@db:5432/hivex
      JWT_SECRET: cambia-este-secreto-largo
      SERVE_STATIC: "1"
      SEED_ON_BOOT: "1"
      WEB_ORIGIN: http://localhost:8787
      PORT: "8787"
    depends_on:
      - db
volumes:
  hivex-pg:
